repos:
  # Built-in fast hooks (zero setup, Rust-native)
  - repo: builtin
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: touched-comments
        name: comments on changed Go code
        entry: go run ./scripts/ratchet -touched-comments
        language: system
        types: [go]
        pass_filenames: false
