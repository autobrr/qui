name: Exceptions

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.15.0"

jobs:
  count:
    name: New lint exceptions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the TypeScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/scripts/exceptions
      - name: Test the counter
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_count_exceptions.py'
          node --test ".github/scripts/exceptions/*.test.mjs"
      - name: Count the new lint exceptions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch --no-tags --filter=blob:none origin "$HEAD"
          python3 -B .github/scripts/count_exceptions.py --labels "$LABELS" "$BASE" "$HEAD"
