name: Lint

on:
  pull_request:

env:
  NODE_VERSION: "24.15.0"

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: |
          webfiles=$({ git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD -- 'web/'; } | sort -u | sed 's|^web/||' | grep -E '\.(ts|tsx|js|jsx)$' || true)
          if [ -n "$webfiles" ]; then echo "$webfiles" | xargs pnpm eslint; else echo "No frontend files to lint."; fi

      - name: Check i18n coverage
        working-directory: web
        run: pnpm check:i18n

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # continue-on-error so a gofix failure reports itself without taking the
      # lint step with it: the job used to fail here and skip linting entirely.
      - name: Check gofix drift on changed Go files
        continue-on-error: true
        id: gofix
        run: |
          gofiles=$({ git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD; } | sort -u | grep '\.go$' || true)
          if [ -z "$gofiles" ]; then
            echo "No backend files to check with go fix."
            exit 0
          fi

          gopkgs=$(printf '%s\n' "$gofiles" | xargs -n 1 dirname | sort -u)
          tmp=$(mktemp)
          failed=0
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            pkg_err=$(mktemp)
            if ! go fix -diff "./$pkg" >> "$tmp" 2> "$pkg_err"; then
              if grep -Eq 'fix: .* skipped \(e\.g\. due to conflicts\)' "$pkg_err"; then
                echo "go fix reported skipped fixes for ./$pkg; continuing."
              else
                echo "go fix failed for ./$pkg:"
                cat "$pkg_err"
                failed=1
              fi
            fi
            rm -f "$pkg_err"
          done <<< "$gopkgs"

          if [ "$failed" -ne 0 ]; then
            rm -f "$tmp"
            exit 1
          fi

          if [ -s "$tmp" ]; then
            echo "go fix changes required for changed Go files:"
            cat "$tmp"
            rm -f "$tmp"
            exit 1
          fi

          rm -f "$tmp"
          echo "go fix check clean."

      - name: Lint backend
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.0
          # The backlog is zero as of this change, so the gate covers the whole
          # repo rather than only changed lines. That is what stops drift
          # accumulating unnoticed again — see #2380.
          only-new-issues: false

      - name: Fail if gofix drift was found
        if: steps.gofix.outcome == 'failure'
        run: |
          echo "go fix reported drift on changed Go files; see the 'Check gofix drift' step above."
          exit 1
