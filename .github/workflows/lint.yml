name: Lint

on:
  pull_request:

env:
  NODE_VERSION: "24.15.0"

jobs:
  windows-changes:
    name: Detect Windows changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Windows-sensitive paths
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Disable rename detection so moves out of these paths still trigger tests.
          changed=$(git diff --name-only --no-renames "origin/$BASE_REF"...HEAD -- \
            '.github/workflows/lint.yml' \
            'internal/tray/qui.ico' \
            'go.mod' 'go.sum' \
            ':(glob)**/*_windows*.go' \
            ':(glob)internal/fsops/**/*.go' \
            ':(glob)internal/externalprograms/**/*.go' \
            ':(glob)internal/services/externalprograms/**/*.go' \
            ':(glob)internal/services/orphanscan/**/*.go' \
            ':(glob)internal/services/crossseed/**/*.go' \
            ':(glob)internal/services/dirscan/**/*.go' \
            ':(glob)internal/models/dirscan*.go' \
            ':(glob)internal/api/handlers/dirscan*.go' \
            ':(glob)internal/api/handlers/orphan_scan*.go' \
            ':(glob)pkg/pathcmp/**/*.go' \
            ':(glob)pkg/pathutil/**/*.go' \
            ':(glob)pkg/hardlink/**/*.go' \
            ':(glob)pkg/hardlinktree/**/*.go' \
            ':(glob)pkg/fsutil/**/*.go' \
            ':(glob)pkg/reflinktree/**/*.go' \
            ':(glob)pkg/sharedextents/**/*.go')
          if [ -n "$changed" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            printf 'Windows-sensitive changes:\n%s\n' "$changed"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'No Windows-sensitive changes.'
          fi

  windows:
    name: Windows compile gate
    needs: windows-changes
    # Preserve the existing required-check name and run if detection failed.
    if: ${{ !cancelled() && needs.windows-changes.outputs.required != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-windows-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Create placeholder web dist for embed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force web/dist | Out-Null
          New-Item -ItemType File -Force web/dist/.gitkeep | Out-Null

      - name: Compile and vet Windows packages and tests
        run: go vet ./...

      # Run both test groups after failures to report all selected errors.
      - name: Test native filesystem and path utilities
        if: ${{ !cancelled() }}
        run: >-
          go test -count=1 -v -timeout=2m
          ./internal/fsops ./internal/fsops/local ./internal/externalprograms
          ./pkg/pathcmp ./pkg/pathutil ./pkg/hardlink ./pkg/hardlinktree
          ./pkg/fsutil ./pkg/reflinktree ./pkg/sharedextents

      # Keep service execution focused; the full suite still runs on Linux.
      # Real ReFS integration remains opt-in through QUI_REFS_TEST_DIR.
      - name: Test Windows service and backend path contracts
        if: ${{ !cancelled() }}
        run: >-
          go test -count=1 -v -timeout=2m
          -run '^(Test.*Windows.*|Test.*PathDialect.*|Test.*BackendDialect|TestResolveRootlessContentDir|TestNormalizePath|TestIsWindowsDriveAbs|TestEnsureCrossCategory_CacheMatchesPathCaseInsensitively|TestDirScanStore_(Create|Update)Directory_RejectsDuplicateCleanedPath|TestPathMatchesDirectory|TestWebhookTriggerScan_RejectsAmbiguousDuplicateDirectoryPaths)$'
          ./internal/services/externalprograms
          ./internal/services/orphanscan ./internal/services/dirscan
          ./internal/services/crossseed ./internal/models ./internal/api/handlers

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: |
          webfiles=$({ git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD -- .; } | sort -u | sed 's|^web/||' | grep -E '\.(ts|tsx|js|jsx|mjs)$' || true)
          if [ -n "$webfiles" ]; then echo "$webfiles" | xargs pnpm eslint; else echo "No frontend files to lint."; fi

      - name: Check i18n coverage
        working-directory: web
        run: pnpm check:i18n

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Migrations are tracked by file name, so installs that already ran one
      # never see a later edit. Comment-only edits pass, and so does a rename
      # with a from/to entry in the *MigrationFilenameRenames tables in db.go.
      - name: Check that existing migrations stay unchanged
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          sql() { sed -e 's/--.*//' -e '/^[[:space:]]*$/d'; }
          status=0
          while IFS=$'\t' read -r change old new; do
            new=${new:-$old}
            if [ "$change" = D ]; then
              echo "::error file=$old::$old was deleted. Installs that ran it keep its schema."
              status=1
              continue
            fi
            if [ "$old" != "$new" ]; then
              # Each backend applies only the shared table and its own table.
              backend=postgres
              [ "${old%/*}" = internal/database/migrations ] && backend=sqlite
              if ! sed -En "/^var (shared|$backend)MigrationFilenameRenames /,/^}/p" internal/database/db.go | grep -A1 "from: *\"$(basename "$old")\"" | grep -q "to: *\"$(basename "$new")\""; then
                echo "::error file=$new::$old was renamed to $new without a from/to entry in sharedMigrationFilenameRenames or ${backend}MigrationFilenameRenames in internal/database/db.go."
                status=1
              fi
            fi
            if ! diff -q <(git show "$BASE:$old" | sql) <(sql < "$new") > /dev/null; then
              echo "::error file=$new::the SQL of existing migration $old changed. Put the change in a new migration."
              status=1
            fi
          done < <(git diff --name-status -M --diff-filter=MRD "$BASE"...HEAD -- internal/database/migrations internal/database/postgres_migrations)
          exit $status

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # continue-on-error so a gofix failure reports itself without taking the
      # lint step with it: the job used to fail here and skip linting entirely.
      - name: Check gofix drift on changed Go files
        continue-on-error: true
        id: gofix
        run: |
          gofiles=$({ git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD; } | sort -u | grep '\.go$' || true)
          if [ -z "$gofiles" ]; then
            echo "No backend files to check with go fix."
            exit 0
          fi

          gopkgs=$(printf '%s\n' "$gofiles" | xargs -n 1 dirname | sort -u)
          tmp=$(mktemp)
          failed=0
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            pkg_err=$(mktemp)
            if ! go fix -diff "./$pkg" >> "$tmp" 2> "$pkg_err"; then
              if grep -Eq 'fix: .* skipped \(e\.g\. due to conflicts\)' "$pkg_err"; then
                echo "go fix reported skipped fixes for ./$pkg; continuing."
              else
                echo "go fix failed for ./$pkg:"
                cat "$pkg_err"
                failed=1
              fi
            fi
            rm -f "$pkg_err"
          done <<< "$gopkgs"

          if [ "$failed" -ne 0 ]; then
            rm -f "$tmp"
            exit 1
          fi

          if [ -s "$tmp" ]; then
            echo "go fix changes required for changed Go files:"
            cat "$tmp"
            rm -f "$tmp"
            exit 1
          fi

          rm -f "$tmp"
          echo "go fix check clean."

      - name: Lint backend
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.0
          # The backlog is zero as of this change, so the gate covers the whole
          # repo rather than only changed lines. That is what stops drift
          # accumulating unnoticed again — see #2380.
          only-new-issues: false

      - name: Fail if gofix drift was found
        if: steps.gofix.outcome == 'failure'
        run: |
          echo "go fix reported drift on changed Go files; see the 'Check gofix drift' step above."
          exit 1
