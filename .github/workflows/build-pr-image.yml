name: Build PR image

# Builds and pushes a Docker image for a pull request from a fork.
# release.yml only pushes images for in-repo PRs. The workflow file comes from
# the ref it is dispatched on. The build job checks out the fork and runs its
# code with a read-only token: it has no registry login and saves no cache. It
# hands the image to the push job as an archive. The push job holds the
# registry token and runs no code from the fork.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
        type: number
      platforms:
        description: "Comma separated list of platforms to build"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: "24.15.0"

permissions:
  contents: read

concurrency:
  group: build-pr-image-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image for PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ inputs.pr }}" --repo "${{ github.repository }}" \
            --json headRefOid,headRepository,headRepositoryOwner,state \
            --jq '"sha=\(.headRefOid)\nrepo=\(.headRepositoryOwner.login)/\(.headRepository.name)\nstate=\(.state)"' \
            | tee -a "$GITHUB_OUTPUT"

      - name: Checkout pull request head
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        working-directory: web
        run: CI='' pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Write the notices file
        run: go run ./scripts/notices

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=pr-${{ inputs.pr }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.pr.outputs.sha }}
            org.opencontainers.image.version=pr-${{ inputs.pr }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./distrib/docker/ci.Dockerfile
          platforms: ${{ inputs.platforms }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=pr-${{ inputs.pr }}
            REVISION=${{ steps.pr.outputs.sha }}
            BUILDER=${{ github.actor }}@github-actions
          provenance: false

      - name: Upload image archive
        uses: actions/upload-artifact@v7
        with:
          name: pr-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "Built the image for PR ${{ inputs.pr }}"
            echo
            echo "- source: \`${{ steps.pr.outputs.repo }}@${{ steps.pr.outputs.sha }}\` (PR ${{ steps.pr.outputs.state }})"
            echo "- platforms: \`${{ inputs.platforms }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  push:
    name: Push Docker image for PR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@v8
        with:
          name: pr-image
          path: ${{ runner.temp }}

      - name: Push image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}:pr-${{ inputs.pr }}
        run: |
          authfile="$RUNNER_TEMP/registry-auth.json"
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --authfile "$authfile" \
            --username "$GITHUB_REPOSITORY_OWNER" --password-stdin "$REGISTRY"
          skopeo copy --all --authfile "$authfile" \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$IMAGE"
          rm -f "$authfile"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
