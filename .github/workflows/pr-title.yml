name: PR title

# goreleaser puts a commit under "Breaking Changes" only when its subject has
# `!:`. PRs are squash-merged, so the PR title becomes that subject.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  breaking:
    if: contains(github.event.pull_request.labels.*.name, 'BREAKING CHANGE')
    runs-on: ubuntu-latest
    steps:
      - name: Require ! in the title of a breaking PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$TITLE"; then
            echo "::error::PR has the BREAKING CHANGE label. Mark the title with !, for example feat(api)!: ..."
            exit 1
          fi

  # The template asks for a "Breaking change" section only when existing users
  # must act after they update, or something they rely on stops working.
  breaking-section:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'BREAKING CHANGE') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the BREAKING CHANGE label when the body has a Breaking change section
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section=$(perl -0777 -ne 's/\r//g; s/<!--.*?-->//gs; print $1 if /^##[ \t]*Breaking changes?[ \t]*\n(.*?)(?=^## |\z)/msi' <<<"$BODY" | tr -d '[:space:]')
          if [[ -n $section ]] && ! grep -qiE '^(none|n/?a)\.?$' <<<"$section"; then
            echo "::error::The PR body has a Breaking change section. Add the BREAKING CHANGE label, or delete the section if existing users do not have to act."
            exit 1
          fi
