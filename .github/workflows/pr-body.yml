name: PR body

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Test the PR body check
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_check_pr_body.py'
      - name: Require complete PR template sections
        run: python3 -B .github/scripts/check_pr_body.py
