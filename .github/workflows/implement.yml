name: Implementer
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Number of a ready-for-agent issue
        required: true
        type: number

# One run at a time, from the check of the issue until the pull request exists.
concurrency:
  group: implement

env:
  ISSUE: ${{ inputs.issue }}
  # The paths that the agent cannot change. Both jobs drop a change that
  # touches one of them. The checks list names with -z, because git quotes
  # a path with special characters, and with --no-renames, so that the old
  # path of a rename counts too.
  FORBIDDEN: '^(\.github/|\.claude/|docs/agents/|go\.(mod|sum)$|web/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$)|(^|/)(AGENTS|CLAUDE)\.md$'

jobs:
  # Builds the issue with Claude Code on the subscription of s0up4200. The open
  # job makes the pull request as the qui-rabbit app. See
  # docs/adr/0021-the-implementer-runs-on-the-maintainers-subscription.md.
  build:
    runs-on: ubuntu-latest
    # Only s0up4200 can start a run, because the run uses that subscription.
    # A re-run by another collaborator changes triggering_actor.
    if: github.ref == 'refs/heads/develop' && github.actor == 's0up4200' && github.triggering_actor == 's0up4200'
    environment: implementer
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # sandbox.sh mounts these paths into the container.
      GOMODCACHE: /home/runner/go/pkg/mod
      GOCACHE: /home/runner/.cache/go-build
    outputs:
      skills: ${{ steps.skills.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # The agent can read .git/config, so leave no token in it.
          persist-credentials: false

      # The issue must be open, have the ready-for-agent label, and have no
      # open sub-issues, open blockers, or open implementer pull request. The
      # agent has no GitHub token, so this step saves the issue and its parent
      # for it.
      - name: Check the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir .implement
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json number,title,state,labels,body,comments > .implement/issue.json
          # shellcheck disable=SC2016 # GraphQL variables, not shell
          gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F n="$ISSUE" -f query='
            query($owner: String!, $name: String!, $n: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $n) {
                  parent { number title body }
                  subIssues(first: 100) { nodes { number state } }
                }
              }
            }' > "$RUNNER_TEMP/tree.json"
          if ! jq -e '.state == "OPEN" and any(.labels[]; .name == "ready-for-agent")' .implement/issue.json > /dev/null; then
            echo "::error::Issue #$ISSUE is closed or does not have the ready-for-agent label."
            exit 1
          fi
          children=$(jq -r '[.data.repository.issue.subIssues.nodes[] | select(.state == "OPEN") | "#\(.number)"] | join(", ")' "$RUNNER_TEMP/tree.json")
          if [[ -n "$children" ]]; then
            echo "::error::Issue #$ISSUE has open sub-issues: $children. Start a run on one of them."
            exit 1
          fi
          # A "blocked by" link can name only an issue, so a body line
          # "Blocked by #N" or "Blocked by: #N, #M" names a blocking pull request.
          # A failed request stops the run.
          set -o pipefail
          blockers=$({
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/dependencies/blocked_by" --paginate \
              --jq '.[] | select(.state == "open") | .html_url' &&
            jq -r '.body // "" | [scan("(?m)^\\s*blocked by:?(.*)"; "i")[0] | scan("#([0-9]+)")[0]] | unique[]' .implement/issue.json |
              while read -r n; do gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq 'select(.state == "open") | .html_url' || exit 1; done
          } | sort -u | paste -sd, -)
          if [[ -n "$blockers" ]]; then
            echo "::error::Issue #$ISSUE is blocked by open work: $blockers"
            exit 1
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json headRefName,url \
            --jq "[.[] | select(.headRefName | startswith(\"implement/$ISSUE/\")) | .url] | join(\", \")")
          if [[ -n "$open" ]]; then
            echo "::error::An implementer pull request for #$ISSUE is open: $open"
            exit 1
          fi
          jq '.data.repository.issue.parent' "$RUNNER_TEMP/tree.json" > .implement/parent.json

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # The sandbox writes agent-built output to GOCACHE. A saved cache
          # would reach later runs on develop, release builds included.
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.15.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      # The sandbox has no network, so download everything first.
      - name: Install dependencies
        run: |
          go mod download
          (cd web && pnpm install --frozen-lockfile)
          # The binary embeds web/dist, and go build needs the directory.
          mkdir -p web/dist && touch web/dist/.gitkeep
          docker pull -q ubuntu:24.04
          # Outside the repo, so that a command in the sandbox cannot change it.
          sudo install -m 755 .github/scripts/implement/sandbox.sh /usr/local/bin/qui-sandbox

      # Gives the run the skills that /implement uses.
      - name: Install the skills
        id: skills
        run: |
          git clone -q --depth 1 https://github.com/s0up4200/skills.git "$RUNNER_TEMP/skills"
          mkdir -p ~/.claude/skills
          for s in mattpocock/implement mattpocock/tdd mattpocock/domain-modeling mattpocock/codebase-design \
            mattpocock/pr aminblg/simple-english cursor/unslop; do
            cp -r "$RUNNER_TEMP/skills/skills/$s" ~/.claude/skills/
          done
          echo "sha=$(git -C "$RUNNER_TEMP/skills" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The Agent SDK package holds the Claude Code binary at a pinned version.
      - name: Install Claude Code
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/scripts/triage

      # The token is in this step only. The agent can run commands only in the
      # sandbox, and it can read files only in the repo and the skills.
      - name: Build the issue
        id: agent
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          .github/scripts/triage/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude -p "/implement $ISSUE" \
            --model claude-opus-5-5 --effort high --max-turns 150 \
            --permission-mode dontAsk --permission-prompts none \
            --setting-sources user,project \
            --append-system-prompt-file .github/scripts/implement/prompt.md \
            --tools Read,Grep,Glob,Edit,Write,Bash,Skill,TodoWrite \
            --allowedTools 'Edit(./**)' 'Read(~/.claude/skills/**)' 'Bash(qui-sandbox *)' Skill \
            --disallowedTools 'Read(//proc/**)' 'Edit(./.github/**)' 'Edit(./.claude/**)' 'Edit(./.git/**)' \
              'Edit(./docs/agents/**)' 'Edit(**/AGENTS.md)' 'Edit(**/CLAUDE.md)' 'Edit(./go.mod)' 'Edit(./go.sum)' \
              'Edit(./web/package.json)' 'Edit(./web/pnpm-lock.yaml)' 'Edit(./web/pnpm-workspace.yaml)' \
            --settings '{"attribution":{"commit":"","pr":""}}' \
            --json-schema '{"type":"object","properties":{"title":{"type":"string","maxLength":64},"body":{"type":"string"}},"required":["title","body"]}' \
            --output-format stream-json --verbose \
          | tee "$RUNNER_TEMP/stream.jsonl" \
          | jq -r --unbuffered '
              if .type == "assistant" then .message.content[]
                | if .type == "text" then .text elif .type == "tool_use" then "> \(.name) \(.input | tostring)" else empty end
              elif .type == "result" then "result: \(.subtype), \(.num_turns) turns", (.permission_denials[]? | "denied: \(tostring)")
              else empty end'
          # The agent gives the title and body as structured output, so it
          # needs no write permission for them.
          jq -j 'select(.type == "result") | .structured_output.title // empty' "$RUNNER_TEMP/stream.jsonl" > .implement/title.txt
          jq -j 'select(.type == "result") | .structured_output.body // empty' "$RUNNER_TEMP/stream.jsonl" > .implement/body.md

      # Runs the checks in the sandbox and saves the change as a patch. The
      # open job applies it on a new runner.
      - name: Check the change
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          problems=()
          [[ "$AGENT_OUTCOME" == success ]] || problems+=("The agent run failed. The workflow log has its output.")
          mv .implement "$RUNNER_TEMP/pr"
          git add -A
          forbidden=$(git diff --cached --no-renames --name-only -z | grep -zE "$FORBIDDEN" | tr '\0' '\n' || true)
          if [[ -n "$forbidden" ]]; then
            problems+=("The agent changed files that it cannot change, so the run drops its change: ${forbidden//$'\n'/, }")
            git reset -q --hard
            git clean -fdq
          fi
          git diff --cached --binary > "$RUNNER_TEMP/pr/change.patch"
          # A run with no change opens no pull request. The failed run sends
          # s0up4200 an email, and the issue stays free for the next run.
          if [[ ! -s "$RUNNER_TEMP/pr/change.patch" ]]; then
            for p in "${problems[@]}" "The run made no change."; do echo "::error::$p"; done
            exit 1
          fi
          qui-sandbox go build ./... || problems+=("\`go build ./...\` failed.")
          mapfile -t pkgs < <(git diff --cached --name-only -- '*.go' | xargs -r -n1 dirname | sort -u | while read -r d; do [[ -d "$d" ]] && echo "./$d"; done)
          if (( ${#pkgs[@]} )); then
            qui-sandbox go vet "${pkgs[@]}" || problems+=("\`go vet\` failed.")
            qui-sandbox go test -count=1 "${pkgs[@]}" || problems+=("\`go test\` failed in the changed packages.")
          fi
          if ! git diff --cached --quiet -- web; then
            qui-sandbox sh -c 'cd web && pnpm lint && pnpm exec tsc -b && pnpm test' || problems+=("The web checks failed.")
          fi
          for p in "${problems[@]}"; do echo "- $p"; done > "$RUNNER_TEMP/pr/problems.md"

      - name: Upload the change
        uses: actions/upload-artifact@v7
        with:
          name: implement
          path: |
            ${{ runner.temp }}/pr/change.patch
            ${{ runner.temp }}/pr/problems.md
            ${{ runner.temp }}/pr/title.txt
            ${{ runner.temp }}/pr/body.md
          retention-days: 7

  # Commits the change and opens the pull request on a new runner, which runs
  # no code from the change. It checks the paths in the patch again.
  open:
    needs: build
    runs-on: ubuntu-latest
    environment: implementer
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the change
        uses: actions/download-artifact@v8
        with:
          name: implement
          path: ${{ runner.temp }}/pr

      - name: Apply the change
        run: |
          git apply --index "$RUNNER_TEMP/pr/change.patch"
          forbidden=$(git diff --cached --no-renames --name-only -z | grep -zE "$FORBIDDEN" | tr '\0' '\n' || true)
          if [[ -n "$forbidden" ]]; then
            echo "::error::The patch changes files that the agent cannot change: ${forbidden//$'\n'/, }"
            exit 1
          fi

      - name: Create the app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.RATCHET_APP_ID }}
          private-key: ${{ secrets.RATCHET_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The app token pushes, so CI and the review bots run on the pull
      # request. A push with GITHUB_TOKEN starts no workflow.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SKILLS: ${{ needs.build.outputs.skills }}
          OUT: ${{ runner.temp }}/pr
        run: |
          branch="implement/$ISSUE/$GITHUB_RUN_ID"
          title=$(head -n1 "$OUT/title.txt" 2>/dev/null || true)
          [[ -n "$title" ]] || title="feat: implement #$ISSUE"
          draft=()
          [[ -s "$OUT/problems.md" ]] && draft=(--draft)
          gh auth setup-git
          git config user.name 'qui-rabbit[bot]'
          git config user.email '346308562+qui-rabbit[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q --allow-empty -m "$title"
          git push -q origin "$branch"
          {
            if (( ${#draft[@]} )); then
              echo "This pull request is a draft because:"
              echo
              cat "$OUT/problems.md"
              echo
            fi
            if [[ -s "$OUT/body.md" ]]; then cat "$OUT/body.md"; else printf 'Closes #%s\n\nThe agent wrote no pull request body.\n' "$ISSUE"; fi
            echo
            echo "---"
            echo "Implementer run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Skills: s0up4200/skills@$SKILLS."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" "${draft[@]}" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"
