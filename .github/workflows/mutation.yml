name: Mutation testing

on:
  pull_request:
    paths:
      - "**.go"
      - .github/workflows/mutation.yml
      - .github/scripts/mutation_threads.py
      - .github/scripts/test_mutation_threads.py

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutate:
    name: Mutate the changed Go lines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test the script
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_mutation_threads.py'
      - name: Mutate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make mutation-go MUTATION_BASE="origin/$BASE_REF" MUTATION_REPORT="$RUNNER_TEMP/mutation.json"
      - name: Find the report
        id: report
        run: |
          if [ -s "$RUNNER_TEMP/mutation.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.report.outputs.found == 'true'
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation.json
          retention-days: 7

  threads:
    name: Post the uncaught mutants
    needs: mutate
    if: needs.mutate.outputs.report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-report
          path: ${{ runner.temp }}
      - name: List the posted mutants
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | @json' > "$RUNNER_TEMP/posted.jsonl"
      - name: List the uncaught mutants
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B .github/scripts/mutation_threads.py \
            --report "$RUNNER_TEMP/mutation.json" --root . \
            --posted "$RUNNER_TEMP/posted.jsonl" --commit "$HEAD" \
            --review "$RUNNER_TEMP/review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the review
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -s "$RUNNER_TEMP/review.json" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --input "$RUNNER_TEMP/review.json" --silent
          fi
