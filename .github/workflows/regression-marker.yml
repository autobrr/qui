name: Regression marker

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  marker:
    if: startsWith(github.event.pull_request.title, 'fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Test the check
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_check_regression_marker.py'
      - name: Require a regression marker beside each new test of a fix
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --filter=blob:none origin "$HEAD"
          python3 -B .github/scripts/check_regression_marker.py --title "$TITLE" --number "$NUMBER" "$BASE" "$HEAD"
