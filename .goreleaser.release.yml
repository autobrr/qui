version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: qui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/autobrr/qui/internal/buildinfo.Version={{.Version}}
      - -X github.com/autobrr/qui/internal/buildinfo.Date={{.Date}}
      - -X github.com/autobrr/qui/internal/buildinfo.Commit={{.Commit}}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
    main: ./cmd/qui
    binary: qui
  # qui-tray.exe: the GUI-subsystem build that serves with the Tray. See
  # docs/adr/0012-the-tray-lives-in-the-served-child-of-a-second-windows-binary.md.
  - id: qui-tray
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui
      - -X github.com/autobrr/qui/internal/buildinfo.Version={{.Version}}
      - -X github.com/autobrr/qui/internal/buildinfo.Date={{.Date}}
      - -X github.com/autobrr/qui/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/autobrr/qui/internal/buildinfo.Tray=true
    goos:
      - windows
    goarch:
      - amd64
    main: ./cmd/qui
    binary: qui-tray

archives:
  - id: qui-archive
    ids:
      - qui
      - qui-tray
    # Only the Windows zip holds qui-tray.exe. A Self-update takes both exes
    # from that one zip, so the archives stay combined.
    allow_different_binary_count: true
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

msi:
  - id: qui-msi
    ids:
      - qui
      - qui-tray
    wxs: ./distrib/windows/qui.wxs
    extra_files:
      - internal/tray/qui.ico
    name: qui_{{ .Version }}_windows_x86_64

release:
  prerelease: auto
  extra_files:
    - glob: web-dist.tar.gz
  footer: |
    **Full Changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/qui/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Docker images

    - `docker pull ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/qui:{{ .Tag }}`
    - `docker pull ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/qui:latest`


    ## What to do next?

    - Join our [Discord server](https://discord.autobrr.com/qui)

    Thank you for using qui!

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum
    cmd: openssl
    signature: "${artifact}.sig"
    args:
      - "dgst"
      - "-sha256"
      - "-sign"
      - "{{ .Env.RELEASE_SIGNING_KEY_FILE }}"
      - "-out"
      - "${signature}"
      - "${artifact}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "Breaking Changes"
      regexp: "^\\w+(\\([^)]*\\))?!:.*$"
      order: 0
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 10
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 20
    - title: "Other Changes"
      regexp: "^.*(chore|docs|style|refactor|test|perf|security|build|ci)[(\\w)]*:+.*$"
      order: 30
