version: "2"

issues:
  max-same-issues: 0

formatters:
  enable:
    - goimports
    - gofmt

  settings:
    goimports:
      local-prefixes:
        - github.com/autobrr/qui

linters:
  enable:
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - ginkgolinter
    - gocritic
    - gosec
    - loggercheck
    - mirror
    - misspell
    - noctx
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - spancheck
    - testifylint
    - unconvert
    - whitespace

  settings:
    depguard:
      rules:
        models-is-a-leaf:
          files: ["**/internal/models/**"]
          deny:
            - { pkg: github.com/autobrr/qui/internal/api, desc: "models never imports api, services, or qbittorrent" }
            - { pkg: github.com/autobrr/qui/internal/services, desc: "models never imports api, services, or qbittorrent" }
            - { pkg: github.com/autobrr/qui/internal/qbittorrent, desc: "models never imports api, services, or qbittorrent" }
        services-never-import-api:
          files: ["**/internal/services/**"]
          deny:
            - { pkg: github.com/autobrr/qui/internal/api, desc: services never import api }
        database-is-a-leaf:
          files: ["**/internal/database/**", "!$test"]
          deny:
            - { pkg: github.com/autobrr/qui/internal/api, desc: "database never imports api, services, or qbittorrent" }
            - { pkg: github.com/autobrr/qui/internal/services, desc: "database never imports api, services, or qbittorrent" }
            - { pkg: github.com/autobrr/qui/internal/qbittorrent, desc: "database never imports api, services, or qbittorrent" }
        qbittorrent-never-imports-up:
          list-mode: lax
          files: ["**/internal/qbittorrent/**"]
          allow:
            # The sync manager queues tracker icon fetches. Removing this edge is a separate change.
            - github.com/autobrr/qui/internal/services/trackericons
          deny:
            - { pkg: github.com/autobrr/qui/internal/api, desc: qbittorrent never imports api or services }
            - { pkg: github.com/autobrr/qui/internal/services, desc: qbittorrent never imports api or services }
        pkg-never-imports-internal:
          files: ["**/pkg/**", "!$test"]
          deny:
            - { pkg: github.com/autobrr/qui/internal, desc: pkg packages stand alone and never import internal }
        gatherer-never-parses:
          files: ["**/internal/services/crossseed/search_gather.go"]
          deny:
            - { pkg: github.com/autobrr/rls, desc: the search gatherer asks the usable predicate and never parses a title (ADR 0007) }
            - { pkg: github.com/autobrr/qui/pkg/releases, desc: the search gatherer asks the usable predicate and never parses a title (ADR 0007) }

    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: ^qbittorrent\.Client\.(SetPreferences\w*|SetMonitoredFolders(Ctx)?|SetRSS(AutoDownloading|Processing)Enabled(Ctx)?)$
          pkg: ^github\.com/autobrr/(go-qbittorrent|qui/internal/qbittorrent)$
          msg: send qBittorrent preference writes through the preference catalog in internal/qbittorrent/prefcatalog
        - pattern: ^(qbittorrent\.TorrentFilterOptions\.)?(Sort|Reverse)$
          pkg: ^github\.com/autobrr/go-qbittorrent$
          msg: qui sorts torrents with torrentOrder (ADR 0014)
        - pattern: ^(releases\.(DefaultParser|NewDefaultParser|NewParser)|rls\.(DefaultParser|NewDefaultParser|NewTagParser|NewReleaseScanner|NewScanner|Parse|ParseString|ParseTags|ParseTagsString))$
          pkg: ^github\.com/autobrr/(qui/pkg/releases|rls)$
          msg: cross-seed code parses release names through the release cache or matcher.parseReleaseName (ADR 0008)
        - pattern: ^orphanscan\.(isIgnoredPath|isPathProtectedByIgnorePaths|TorrentFileMap\.(Has|HasAnyInDir))$
          pkg: ^github\.com/autobrr/qui/internal/services/orphanscan$
          msg: ask the protected path module in internal/services/orphanscan/protected.go

    exhaustive:
      # A switch with a default has handled the rest by definition, and the repo
      # asks for behaviour-bearing branches rather than a case per enum value
      # that falls through to the same place.
      default-signifies-exhaustive: true

    gocritic:
      disabled-checks:
        # Taste, not correctness, and most of the hits are in crossseed and
        # qbittorrent where the repo asks for minimal diffs.
        - ifElseChain

    misspell:
      ignore-rules:
        - alltime # Already used in metrics
        - hardlink
        - hardlinked

    gosec:
      excludes:
        - G115

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # The preference catalog is the only code that sends a preference write.
      - path: internal/qbittorrent/prefcatalog/
        linters:
          - forbidigo
        text: preference catalog

      # The one-parser rule binds only the cross-seed production code.
      - path-except: ^internal/services/crossseed/
        linters:
          - forbidigo
        text: ADR 0008
      - path: _test\.go
        linters:
          - forbidigo
        text: ADR 0008

      # Only the Protected path module looks up torrent files and ignore paths.
      - path: internal/services/orphanscan/protected(_test)?\.go$
        linters:
          - forbidigo
        text: protected path module

      # A parameter an interface forces on an implementation still documents
      # what the caller passes; renaming it to _ loses that.
      - linters:
          - revive
        text: "unused-parameter"

      # Renaming CrossSeedRequest to Request, MetricsManager to Manager and so
      # on is a wide rename through every caller for a naming preference.
      - linters:
          - revive
        text: "stutters"

      # gosec's taint analysis follows archive entry names through
      # safeArchiveEntryPath, which validates them in the slash domain, and
      # cannot see the check. Scoped to the statements in the extraction flow
      # so a new unvalidated path in this file is still reported.
      - path: internal/api/handlers/backups\.go
        linters:
          - gosec
        text: "G703"
        source: "tmpFile\\.Name\\(\\)|filepath\\.Dir\\(destPath\\)|os\\.Open\\(archivePath\\)"

      # The generated config template contains a commented-out password field.
      # Scoped to the template literal itself, which cannot carry a nolint.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: "G101"
        source: "configTemplate := "

      # Test fixtures are allowed to hold obvious fake credentials, build
      # requests without a context, and set cookies without the production
      # attributes.
      - path: _test\.go
        linters:
          - gosec
          - noctx
